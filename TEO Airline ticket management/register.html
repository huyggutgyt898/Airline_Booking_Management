<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F766E">
  <meta name="description" content="Tạo tài khoản TEO Airlines.">
  <title>Đăng ký — TEO Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html" aria-label="TEO Airlines — Về trang đặt vé">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.8 3.2c-.9-.9-2.2-.4-3.1.5l-4.3 4.3-7.8-2c-.5-.1-1 .1-1.4.4l-.9.9 5.7 3.2-3.1 3.1-2.8-.7L2 14l3.7 1.8L7.5 19l1.1-1.1-.7-2.8 3.1-3.1 3.2 5.7.9-.9c.4-.4.5-.9.4-1.4l-2-7.8 4.3-4.3c.9-.9 1.4-2.2.5-3.1z"></path>
        </svg>
      </span>
      <span class="brand-wordmark"><strong>TEO</strong><small>airlines</small></span>
    </a>

    <section class="auth-panel auth-panel-register" aria-labelledby="auth-title">
      <div class="auth-heading">
        <h1 id="auth-title">Tạo tài khoản</h1>
        <p>Đăng ký để sẵn sàng cho hành trình tiếp theo.</p>
      </div>

      <form class="auth-form" id="register-form" data-auth-form="register">
        <div class="auth-field">
          <label for="register-name">Họ và tên</label>
          <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Nhập họ và tên" required autofocus>
        </div>

        <div class="auth-field">
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" placeholder="Nhập email" required>
        </div>

        <div class="auth-field">
          <label for="register-phone">Số điện thoại</label>
          <input id="register-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Nhập số điện thoại" required>
        </div>

        <div class="auth-field">
          <label for="register-password">Mật khẩu</label>
          <div class="auth-password-wrap">
            <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Tạo mật khẩu" minlength="8" required>
            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="register-password" data-password-toggle>
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-field-hint">Ít nhất 8 ký tự</p>
        </div>

        <div class="auth-field">
          <label for="register-confirm-password">Xác nhận mật khẩu</label>
          <div class="auth-password-wrap">
            <input id="register-confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" minlength="8" required aria-describedby="confirm-password-error">
            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="register-confirm-password" data-password-toggle>
              <i data-lucide="eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-field-error" id="confirm-password-error" aria-live="polite"></p>
        </div>

        <label class="auth-terms">
          <input id="terms-agreement" name="terms" type="checkbox" required>
          <span>Tôi đồng ý với <a href="index.html#support" data-legal-link="điều khoản sử dụng">Điều khoản sử dụng</a> và <a href="index.html#support" data-legal-link="chính sách riêng tư">Chính sách riêng tư</a>.</span>
        </label>

        <p class="auth-form-message" id="auth-form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary auth-submit" type="submit" data-auth-submit>
          <span>Tạo tài khoản</span>
        </button>
      </form>

      <div class="auth-social">
        <div class="auth-divider" aria-hidden="true"><span>hoặc</span></div>
        <button class="button button-outline auth-google" type="button" data-google-auth>
          <span class="google-mark" aria-hidden="true">G</span>
          Đăng ký bằng Google
        </button>
      </div>

      <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      <p class="auth-demo-note">Đây là giao diện minh hoạ; dịch vụ xác thực chưa được kết nối.</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="js/auth.js"></script>
</body>
</html>
